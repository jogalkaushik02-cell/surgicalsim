name: SURGICALSIM Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SURGICALSIM
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Install Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          cd "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* .
          rmdir templates
          ls android_debug.apk android_release.apk

      - name: Setup debug keystore
        run: |
          keytool -genkey -v -keystore "$HOME/.config/godot/keystores/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings for keystore
        run: |
          mkdir -p "$HOME/.config/godot"
          cat >> "$HOME/.config/godot/editor_settings-4.tres" << 'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "/home/runner/.config/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Check Android export preset
        run: |
          if [ ! -f "export_presets.cfg" ]; then
            echo "::error::export_presets.cfg is missing. Create an Android export preset in Godot before Android builds can run."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SURGICALSIM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SURGICALSIM-debug-apk
          path: build/SURGICALSIM-debug.apk
          if-no-files-found: error
