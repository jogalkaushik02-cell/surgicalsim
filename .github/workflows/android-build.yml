name: SURGICALSIM Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SURGICALSIM
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Install Android export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          cd "$TEMPLATES_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* .
          rmdir templates
          ls android_debug.apk android_release.apk

      - name: Setup debug keystore
        run: |
          KEYSTORE_DIR="$HOME/.config/godot/keystores"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkey -v \
            -keystore "$KEYSTORE_DIR/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=$KEYSTORE_DIR/debug.keystore" >> $GITHUB_ENV

      - name: Initialize Godot editor
        run: |
          godot --headless --path . --editor --quit 2>&1 || true

      - name: Configure editor keystore settings
        run: |
          EDITOR_CFG="$HOME/.config/godot/editor_settings-4.tres"
          if [ ! -f "$EDITOR_CFG" ]; then
            echo "[gd_resource type=\"EditorSettings\" format=3]" > "$EDITOR_CFG"
            echo "" >> "$EDITOR_CFG"
            echo "[resource]" >> "$EDITOR_CFG"
          fi
          sed -i '/export\/android\/debug_keystore/d' "$EDITOR_CFG"
          sed -i '/export\/android\/debug_keystore_user/d' "$EDITOR_CFG"
          sed -i '/export\/android\/debug_keystore_pass/d' "$EDITOR_CFG"
          sed -i '/\[resource\]/a export/android/debug_keystore = "'"$KEYSTORE_PATH"'"' "$EDITOR_CFG"
          sed -i '/debug_keystore =/a export/android/debug_keystore_user = "androiddebugkey"' "$EDITOR_CFG"
          sed -i '/debug_keystore_user/a export/android/debug_keystore_pass = "android"' "$EDITOR_CFG"

      - name: Check Android export preset
        run: |
          if [ ! -f "export_presets.cfg" ]; then
            echo "::error::export_presets.cfg is missing."
            exit 1
          fi

      - name: Configure export preset keystore
        run: |
          sed -i 's|keystore/debug=""|keystore/debug="'"$KEYSTORE_PATH"'"|' export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SURGICALSIM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SURGICALSIM-debug-apk
          path: build/SURGICALSIM-debug.apk
          if-no-files-found: error
