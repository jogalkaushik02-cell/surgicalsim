name: SURGICALSIM Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SURGICALSIM
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Validate Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Check Android export preset
        run: |
          if [ ! -f "export_presets.cfg" ]; then
            echo "::error::export_presets.cfg is missing. Create an Android export preset in Godot before Android builds can run."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SURGICALSIM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SURGICALSIM-debug-apk
          path: build/SURGICALSIM-debug.apk
          if-no-files-found: error
